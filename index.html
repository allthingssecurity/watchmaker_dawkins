<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <title>Watchmaker Academy</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Press+Start+2P">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Cinzel:wght@400;700&display=swap">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; background: #1a1a2e; overflow: hidden; }

        #game-wrapper { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #ludumdare29 { border: 2px solid #fff; font-family: 'Press Start 2P'; }

        @media (min-width: 600px) {
            #ludumdare29 { width: 320px; height: 512px; }
            #touch-controls { display: none !important; }
        }
        @media (max-width: 599px) {
            #ludumdare29 { width: 100vw; height: calc(100vw * 1.6); max-height: calc(100vh - 130px); }
        }

        #loadfont { font-family: 'Press Start 2P'; color: #1a1a2e; position: absolute; }

        #touch-controls {
            position: fixed; bottom: 0; left: 0; right: 0; height: 120px;
            display: flex; justify-content: space-between; align-items: center; padding: 10px 15px;
            background: linear-gradient(to top, rgba(0,0,0,0.95), rgba(0,0,0,0.8)); z-index: 1000;
        }
        .touch-btn {
            width: 75px; height: 75px; border-radius: 50%; border: 3px solid #fff;
            background: rgba(255,255,255,0.25); color: #fff; font-size: 26px;
            display: flex; align-items: center; justify-content: center;
            user-select: none; -webkit-user-select: none;
        }
        .touch-btn.active { background: rgba(255,255,255,0.6); transform: scale(0.92); }
        .touch-btn-small { width: 50px; height: 50px; font-size: 18px; }
        #touch-center-zone { display: flex; flex-direction: column; gap: 8px; align-items: center; }
    </style>
</head>
<body>
    <div id="game-wrapper"><div id="ludumdare29"></div></div>
    <div id="loadfont">.</div>

    <div id="touch-controls">
        <button class="touch-btn" id="touch-left">◀</button>
        <div id="touch-center-zone">
            <button class="touch-btn touch-btn-small" id="touch-book">📖</button>
            <button class="touch-btn" id="touch-boost">⚡</button>
        </div>
        <button class="touch-btn" id="touch-right">▶</button>
    </div>

    <script src="js/phaser.min.js"></script>
    <script src="js/game.min.js"></script>

    <script>
    (function() {
        window.touchInput = { left: false, right: false, boost: false };

        function bind(id, key) {
            var el = document.getElementById(id);
            if (!el) return;

            function down(e) {
                e.preventDefault();
                el.classList.add('active');
                window.touchInput[key] = true;
            }
            function up(e) {
                el.classList.remove('active');
                window.touchInput[key] = false;
            }

            el.addEventListener('touchstart', down, {passive: false});
            el.addEventListener('touchend', up, {passive: false});
            el.addEventListener('touchcancel', up);
            el.addEventListener('mousedown', down);
            el.addEventListener('mouseup', up);
            el.addEventListener('mouseleave', up);
        }

        bind('touch-left', 'left');
        bind('touch-right', 'right');
        bind('touch-boost', 'boost');

        // Book button
        var bookBtn = document.getElementById('touch-book');
        if (bookBtn) {
            function openBook(e) {
                e.preventDefault();
                var evt = new KeyboardEvent('keydown', {key: 'b', keyCode: 66, bubbles: true});
                document.dispatchEvent(evt);
            }
            bookBtn.addEventListener('touchstart', openBook, {passive: false});
            bookBtn.addEventListener('click', openBook);
        }

        // Prevent zoom
        document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
    })();
    </script>

    <style>
        #book-overlay { position: fixed; inset: 0; display: none; z-index: 9999; }
        #book-overlay .shade { position: absolute; inset: 0; background: rgba(0,0,0,0.9); }
        .book-container {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            width: 90vw; max-width: 700px; height: 75vh; max-height: 480px; display: flex;
        }
        @media (max-width: 599px) {
            .book-container { width: 96vw; height: auto; max-height: 60vh; flex-direction: column; }
            .book-spine { display: none; }
            .book-page-left, .book-page-right { border-radius: 8px !important; min-height: 150px; }
        }
        .book-spine { width: 25px; background: linear-gradient(90deg, #2d1810, #4a2c1a, #2d1810); }
        .book-page-left { flex: 1; background: linear-gradient(135deg, #f5e6c8, #e8d5a3); padding: 18px; overflow-y: auto; }
        .book-page-right { flex: 1; background: linear-gradient(225deg, #f5e6c8, #e8d5a3); padding: 18px; overflow-y: auto; display: flex; flex-direction: column; }

        #book-chapter { font-family: 'Cinzel', serif; font-size: 13px; color: #8b6914; margin-bottom: 6px; }
        #book-title { font-family: 'IM Fell English', serif; font-size: 18px; color: #2d1810; margin-bottom: 12px; border-bottom: 1px solid #c9a84c; padding-bottom: 8px; }
        #book-lines { font-family: 'IM Fell English', serif; font-size: 14px; line-height: 1.6; color: #3d2914; }
        #book-lines p { margin-bottom: 10px; }
        #book-summary { font-family: 'IM Fell English', serif; font-size: 13px; color: #3d2914; flex: 1; }
        #book-total-concepts { font-family: 'Cinzel', serif; font-size: 11px; color: #8b6914; margin-top: 8px; }

        .book-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid #c9a84c; gap: 10px; }
        .book-nav button {
            font-family: 'Cinzel', serif; font-size: 13px; padding: 10px 18px; border-radius: 4px;
            background: linear-gradient(to bottom, #4a3728, #2d1810); color: #d4a84b; border: 2px solid #8b6914;
            min-width: 70px;
        }
        .book-nav button:active { transform: scale(0.95); }
        .book-nav button:disabled { opacity: 0.3; }

        #book-close-btn {
            position: absolute; top: 12px; right: 12px; font-family: 'Cinzel', serif; font-size: 13px;
            background: #d4a84b; color: #2d1810; border: none; padding: 10px 16px; border-radius: 4px;
            font-weight: bold; z-index: 10;
        }
        #book-close-btn:active { transform: scale(0.95); }

        #concept-toast { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(45,24,16,0.95); color: #d4a84b; border: 2px solid #8b6914; padding: 8px 14px; border-radius: 4px; z-index: 9998; opacity: 0; pointer-events: none; font-family: 'IM Fell English', serif; font-size: 14px; }

        .page-flip { animation: flip 0.3s ease-out; }
        @keyframes flip { 50% { transform: rotateY(-8deg); } }
    </style>

    <div id="book-overlay">
        <div class="shade"></div>
        <button id="book-close-btn">✕ CLOSE</button>
        <div class="book-container">
            <div class="book-spine"></div>
            <div class="book-page-left" id="book-page-left">
                <div id="book-chapter">Chapter I</div>
                <h2 id="book-title">The Watchmaker</h2>
                <div id="book-lines"></div>
            </div>
            <div class="book-page-right">
                <div id="book-summary"></div>
                <div id="book-total-concepts"></div>
                <div class="book-nav">
                    <button id="book-prev">◀ PREV</button>
                    <span id="book-page" style="font-family:Cinzel,serif;color:#8b6914;font-size:12px;">1/1</span>
                    <button id="book-next">NEXT ▶</button>
                </div>
            </div>
        </div>
    </div>
    <div id="concept-toast"></div>
    <audio id="page-flip-sound" preload="auto"></audio>
</body>
</html>
