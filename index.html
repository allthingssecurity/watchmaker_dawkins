<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <title>Watchmaker Academy</title>
    <meta name="description" content="Educational drilling game based on The Blind Watchmaker"/>
    <link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/css?family=Press+Start+2P">
    <link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Cinzel:wght@400;700&display=swap">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%;
            background: #1a1a2e;
            overflow: hidden;
            touch-action: none;
        }

        #game-wrapper {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #ludumdare29 {
            border: 2px solid #fff;
            font-family: 'Press Start 2P';
            max-width: 100vw;
            max-height: calc(100vh - 120px);
            touch-action: none;
        }

        @media (min-width: 600px) {
            #ludumdare29 { width: 320px; height: 512px; }
            #touch-controls { display: none !important; }
        }

        @media (max-width: 599px) {
            #ludumdare29 {
                width: 100vw;
                height: calc(100vw * 1.6);
                max-height: calc(100vh - 140px);
            }
        }

        #loadfont { font-family: 'Press Start 2P'; color: #1a1a2e; position: absolute; }

        #touch-controls {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 120px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.5));
            z-index: 1000;
        }

        .touch-btn {
            width: 70px; height: 70px;
            border-radius: 50%;
            border: 3px solid #fff;
            background: rgba(255,255,255,0.15);
            color: #fff;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        .touch-btn:active, .touch-btn.active {
            background: rgba(255,255,255,0.4);
        }
        .touch-btn-small { width: 50px; height: 50px; font-size: 14px; }

        #touch-left-zone, #touch-right-zone { display: flex; gap: 15px; align-items: center; }
        #touch-center-zone { display: flex; flex-direction: column; gap: 8px; align-items: center; }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <div id="ludumdare29"></div>
    </div>
    <div id="loadfont">.</div>

    <div id="touch-controls">
        <div id="touch-left-zone">
            <button class="touch-btn" id="touch-left">&#9664;</button>
        </div>
        <div id="touch-center-zone">
            <button class="touch-btn touch-btn-small" id="touch-book">B</button>
            <button class="touch-btn" id="touch-boost">BOOST</button>
        </div>
        <div id="touch-right-zone">
            <button class="touch-btn" id="touch-right">&#9654;</button>
        </div>
    </div>

    <script src="js/phaser.min.js"></script>
    <script src="js/game.min.js"></script>

    <script>
    (function() {
        window.touchInput = { left: false, right: false, boost: false };

        function setTouch(id, state) {
            var btn = document.getElementById(id);
            if (state) btn.classList.add('active');
            else btn.classList.remove('active');

            if (id === 'touch-left') window.touchInput.left = state;
            if (id === 'touch-right') window.touchInput.right = state;
            if (id === 'touch-boost') window.touchInput.boost = state;
        }

        ['touch-left', 'touch-right', 'touch-boost'].forEach(function(id) {
            var btn = document.getElementById(id);
            btn.addEventListener('touchstart', function(e) { e.preventDefault(); setTouch(id, true); }, { passive: false });
            btn.addEventListener('touchend', function(e) { e.preventDefault(); setTouch(id, false); }, { passive: false });
            btn.addEventListener('touchcancel', function(e) { setTouch(id, false); });
            btn.addEventListener('mousedown', function(e) { setTouch(id, true); });
            btn.addEventListener('mouseup', function(e) { setTouch(id, false); });
            btn.addEventListener('mouseleave', function(e) { setTouch(id, false); });
        });

        document.getElementById('touch-book').addEventListener('touchstart', function(e) {
            e.preventDefault();
            var evt = new KeyboardEvent('keydown', { key: 'b', keyCode: 66, bubbles: true });
            document.dispatchEvent(evt);
        }, { passive: false });

        document.getElementById('touch-book').addEventListener('click', function(e) {
            var evt = new KeyboardEvent('keydown', { key: 'b', keyCode: 66, bubbles: true });
            document.dispatchEvent(evt);
        });

        document.addEventListener('touchstart', function(e) {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });

        var lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            var now = Date.now();
            if (now - lastTouchEnd <= 300) e.preventDefault();
            lastTouchEnd = now;
        }, { passive: false });
    })();
    </script>

    <style>
        #book-overlay { position: fixed; inset: 0; display: none; z-index: 9999; perspective: 1500px; }
        #book-overlay .shade { position: absolute; inset:0; background: radial-gradient(ellipse at center, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.9) 100%); }

        .book-container {
            position: absolute; left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            width: 90vw; max-width: 700px; height: 80vh; max-height: 500px;
            display: flex;
        }

        @media (max-width: 599px) {
            .book-container { width: 95vw; height: auto; max-height: 60vh; flex-direction: column; }
            .book-spine { display: none; }
            .book-page-left, .book-page-right { border-radius: 5px !important; min-height: 200px; }
        }

        .book-spine {
            width: 30px;
            background: linear-gradient(90deg, #2d1810 0%, #4a2c1a 50%, #2d1810 100%);
            border-radius: 3px 0 0 3px;
        }

        .book-page-left {
            flex: 1;
            background: linear-gradient(135deg, #f5e6c8 0%, #e8d5a3 50%, #f0e0b8 100%);
            border-radius: 3px 0 0 3px;
            padding: 20px;
            overflow-y: auto;
        }

        .book-page-right {
            flex: 1;
            background: linear-gradient(225deg, #f5e6c8 0%, #e8d5a3 50%, #f0e0b8 100%);
            border-radius: 0 3px 3px 0;
            padding: 20px;
            overflow-y: auto;
            display: flex; flex-direction: column;
        }

        #book-chapter { font-family: 'Cinzel', serif; font-size: 14px; color: #8b6914; margin-bottom: 8px; }
        #book-title { font-family: 'IM Fell English', serif; font-size: 20px; color: #2d1810; margin-bottom: 15px; border-bottom: 1px solid #c9a84c; padding-bottom: 10px; }
        #book-lines { font-family: 'IM Fell English', serif; font-size: 15px; line-height: 1.7; color: #3d2914; }
        #book-lines p { margin-bottom: 12px; text-indent: 20px; }

        .book-nav { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 15px; border-top: 1px solid #c9a84c; }
        .book-nav button { font-family: 'Cinzel', serif; background: linear-gradient(to bottom, #4a3728, #2d1810); color: #d4a84b; border: 1px solid #8b6914; padding: 8px 16px; border-radius: 3px; cursor: pointer; font-size: 12px; }
        .book-nav button:disabled { opacity: 0.4; }

        #book-close-btn { position: absolute; top: 10px; right: 10px; font-family: 'Cinzel', serif; background: #8b6914; color: #fff; border: none; padding: 8px 14px; border-radius: 3px; cursor: pointer; font-size: 12px; z-index: 10; }
        #book-summary { font-family: 'IM Fell English', serif; font-size: 14px; color: #3d2914; }
        #book-total-concepts { font-family: 'Cinzel', serif; font-size: 12px; color: #8b6914; margin-top: 10px; }

        #concept-toast { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(45,24,16,0.95); color: #d4a84b; border: 2px solid #8b6914; padding: 10px 18px; border-radius: 5px; z-index: 9998; opacity: 0; pointer-events: none; transition: opacity 0.3s; font-family: 'IM Fell English', serif; font-size: 16px; }

        @keyframes pageFlip { 0% { transform: rotateY(0deg); } 50% { transform: rotateY(-15deg); } 100% { transform: rotateY(0deg); } }
        .page-flip { animation: pageFlip 0.4s ease-in-out; }
    </style>

    <div id="book-overlay">
        <div class="shade"></div>
        <button id="book-close-btn">Close</button>
        <div class="book-container">
            <div class="book-spine"></div>
            <div class="book-page-left" id="book-page-left">
                <div id="book-chapter">Chapter I</div>
                <h2 id="book-title">The Watchmaker</h2>
                <div id="book-lines"></div>
            </div>
            <div class="book-page-right">
                <div id="book-summary"></div>
                <div id="book-total-concepts"></div>
                <div class="book-nav">
                    <button id="book-prev">Prev</button>
                    <span id="book-page">1/1</span>
                    <button id="book-next">Next</button>
                </div>
            </div>
        </div>
    </div>
    <div id="concept-toast"></div>

</body>
</html>
